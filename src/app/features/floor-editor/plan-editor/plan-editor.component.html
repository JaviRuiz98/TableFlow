<div class="editor-shell" [class.surface-hidden]="hideSurface">
  <app-editor-toolbar
    [mode]="mode"
    [tool]="tool"
    [toolLabel]="toolLabel"
    [canEditGeometry]="canEditGeometry"
    [isAdmin]="isAdmin"
    [isLocked]="!!plan.is_locked"
    [canZoomOut]="canZoomOut"
    [canZoomIn]="canZoomIn"
    [historyIndex]="historyIndex"
    [historyLength]="history.length"
    [drawingLength]="drawing.length"
    [selectedElementId]="selectedElementId"
    [selectedTable]="selectedTable"
    [selectedReserved]="selectedReserved"
    [showTextSizeControl]="!!selectedTextElement"
    [selectedTextFontSize]="selectedTextFontSize"
    (setTool)="setTool($event)"
    (save)="saveDesign()"
    (lockToggle)="togglePlanLock()"
    (deleteSelected)="deleteSelected()"
    (clearDrawing)="clearDrawing()"
    (addTable)="addTable()"
    (addReserved)="addReserved()"
    (undo)="undo()"
    (redo)="redo()"
    (zoom)="zoom($event)"
    (textFontSizeChange)="setSelectedTextFontSize($event)">
  </app-editor-toolbar>

  <div
    class="canvas-area"
    #container
    [class.draw-mode]="tool === 'draw'"
    [class.text-mode]="tool === 'text'"
    (pointerdown)="pointerDown($event)"
    (pointermove)="pointerMove($event)"
    (pointerup)="pointerUp($event)"
    (pointercancel)="pointerUp($event)">
  </div>

  <app-order-attention-dialog
    [open]="showOrderDialog"
    [target]="selectedOrderTarget"
    [siblingTables]="operationalTables"
    (closed)="onOrderDialogClosed()"
    (pendingChanged)="onOrderDialogPendingChanged()"
    (canvasRefresh)="onOrderCanvasRefresh()"
    (targetPatched)="onOrderTargetPatched()"
    (transferCompleted)="onTransferCompleted($event)">
  </app-order-attention-dialog>

  <app-plan-editor-dialogs
    [showUnlockDialog]="showUnlockDialog"
    [showDeletePasswordDialog]="showDeletePasswordDialog"
    [showServedDeleteWarning]="showServedDeleteWarning"
    [showTextDialog]="showTextDialog"
    [showSaveDialog]="showSaveDialog"
    [(newText)]="newText"
    [(deletePassword)]="deletePassword"
    [deleteError]="deleteError"
    [pendingDeleteTargetType]="pendingDeleteTarget?.type ?? null"
    (closeUnlock)="closeUnlockDialog()"
    (confirmUnlock)="confirmUnlock()"
    (closeDeletePassword)="closeDeletePasswordDialog()"
    (confirmProtectedDelete)="confirmProtectedDelete()"
    (cancelServedDelete)="cancelServedDelete()"
    (confirmServedDelete)="confirmServedDelete()"
    (closeText)="closeTextDialog()"
    (confirmAddText)="confirmAddText()"
    (closeSave)="closeSaveDialog()">
  </app-plan-editor-dialogs>
</div>
