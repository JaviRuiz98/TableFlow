<div class="admin-app" (click)="closeUserMenu()">
  <header class="admin-topbar">
    <div class="brand-block">
      <img
        class="brand-logo"
        [src]="branding.assets.logoCompactUrl"
        [alt]="branding.productName"
        width="56"
        height="46"
      />
      <div class="brand-copy">
        <strong class="company" [title]="companyName()">{{ companyName() }}</strong>
      </div>
    </div>

    <nav class="admin-nav" aria-label="Navegación administración" (click)="$event.stopPropagation()">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
          (click)="goAdminSection($event, item.path)"
          >{{ item.desktopLabel }}</a
        >
      }
    </nav>

    <div class="top-actions" (click)="$event.stopPropagation()">
      <div class="user-menu">
        <button type="button" class="user-trigger" (click)="toggleUserMenu()">
          <span>{{ adminLabel() }}</span>
          <ion-icon name="chevron-down-outline"></ion-icon>
        </button>
        @if (userMenuOpen()) {
          <div class="user-dropdown">
            <button type="button" (click)="openSala()">
              <ion-icon name="grid-outline"></ion-icon>
              Abrir gestión de sala
            </button>
            <button type="button" class="danger" (click)="logout()">
              <ion-icon name="log-out-outline"></ion-icon>
              Cerrar sesión
            </button>
          </div>
        }
      </div>
    </div>
  </header>

  <!--
    Outside ion-content on purpose: fullscreen content overlays custom chrome on mobile
    and steals taps. Explicit navigate avoids overflow-x scroll eating the first touch.
  -->
  <nav class="admin-nav-mobile" aria-label="Secciones" (click)="$event.stopPropagation()">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
        (click)="goAdminSection($event, item.path)"
        >{{ item.mobileLabel }}</a
      >
    }
  </nav>

  <ion-content class="admin-content">
    <div class="admin-page">
      <router-outlet />
    </div>
  </ion-content>
</div>
